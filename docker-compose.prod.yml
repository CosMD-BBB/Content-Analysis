# ใช้บนเซิร์ฟเวอร์จริง: docker compose -f docker-compose.prod.yml up -d --build
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-content}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?ตั้ง POSTGRES_PASSWORD ใน .env}
      POSTGRES_DB: ${POSTGRES_DB:-content_studio}
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-content}"]
      interval: 10s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-content}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-content_studio}
      UPLOAD_DIR: /data/uploads
    volumes: [uploads:/data/uploads]
    depends_on:
      db: { condition: service_healthy }

  worker:
    build: .
    restart: unless-stopped
    command: ["node", "dist/worker/index.mjs"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-content}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-content_studio}
    depends_on:
      web: { condition: service_healthy }

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:?ตั้ง DOMAIN ใน .env เช่น content.example.com}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    depends_on: [web]

volumes:
  dbdata:
  uploads:
  caddydata:
