<title>Content Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>

/* Layout: floating sidebar panel + working canvas; drawer slides in from the right for content detail.
   Color: cool ink neutrals biased toward the cobalt accent; status colors are semantic and separate. */
:root {
  --bg: #F3F4F9;
  --surface: #FFFFFF;
  --surface-2: #ECEEF5;
  --line: #DADDE8;
  --fg: #141829;
  --muted: #5A6077;
  --faint: #8A90A6;
  --accent: #3E4FE0;
  --accent-ink: #FFFFFF;
  --accent-soft: #E4E7FD;
  --ok: #0F7F55;   --ok-soft: #DCF2E8;
  --warn: #A35F00; --warn-soft: #FBEBD3;
  --bad: #C2313B;  --bad-soft: #FBE1E3;
  --info: #2763C4; --info-soft: #E0EBFB;
  --teal: #0B7E8C; --teal-soft: #DAF1F3;
  --fav: #D99400;
  --shadow: 0 1px 2px rgba(20,24,41,.05), 0 8px 24px rgba(20,24,41,.06);
  --scrim: rgba(14,17,32,.42);
  --f-display: "Anuphan", "IBM Plex Sans Thai", system-ui, sans-serif;
  --f-body: "IBM Plex Sans Thai", "Noto Sans Thai", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1020; --surface: #151A2D; --surface-2: #1D2238; --line: #2A3150;
    --fg: #E7E9F4; --muted: #9BA1BA; --faint: #6E7491;
    --accent: #8391FF; --accent-ink: #0D1020; --accent-soft: #232A57;
    --ok: #45D19A; --ok-soft: #12322A; --warn: #F0B45A; --warn-soft: #382A12;
    --bad: #FF7C84; --bad-soft: #3A1A20; --info: #79A8FF; --info-soft: #182A4A;
    --teal: #4FD0DD; --teal-soft: #0F3036; --fav: #FFC53D;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.25);
    --scrim: rgba(0,0,0,.55);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1020; --surface: #151A2D; --surface-2: #1D2238; --line: #2A3150;
  --fg: #E7E9F4; --muted: #9BA1BA; --faint: #6E7491;
  --accent: #8391FF; --accent-ink: #0D1020; --accent-soft: #232A57;
  --ok: #45D19A; --ok-soft: #12322A; --warn: #F0B45A; --warn-soft: #382A12;
  --bad: #FF7C84; --bad-soft: #3A1A20; --info: #79A8FF; --info-soft: #182A4A;
  --teal: #4FD0DD; --teal-soft: #0F3036; --fav: #FFC53D;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.25);
  --scrim: rgba(0,0,0,.55);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 14px; line-height: 1.55; }
h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; letter-spacing: -.01em; }
h1 { font-size: clamp(24px, 3vw, 30px); font-weight: 700; line-height: 1.2; }
h2 { font-size: 17px; font-weight: 600; }
h3 { font-size: 15px; font-weight: 600; }
p { margin: 0; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.small { font-size: 12.5px; }
.eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); font-weight: 600; }
.ico { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
.ico.sm { width: 15px; height: 15px; }
.ico.filled { fill: currentColor; }

/* Shell */
.shell { display: grid; grid-template-columns: 236px minmax(0, 1fr); gap: 20px; padding-block: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); min-height: 100vh; }
.side { position: sticky; top: calc(16px + env(safe-area-inset-top, 0px)); height: calc(100vh - 32px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); background: var(--surface); border: 1px solid var(--line); border-radius: 16px; display: flex; flex-direction: column; padding: 16px 12px; gap: 14px; overflow-y: auto; }
.brand { display: flex; align-items: center; gap: 10px; padding: 2px 6px 6px; }
.brand-mark { width: 34px; height: 34px; border-radius: 10px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-family: var(--f-display); font-weight: 700; font-size: 17px; }
.brand-name { font-family: var(--f-display); font-weight: 700; font-size: 17px; line-height: 1.1; }
.brand-sub { font-size: 11px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
.nav-group { display: flex; flex-direction: column; gap: 2px; }
.nav-label { font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--faint); font-weight: 600; padding: 8px 10px 4px; }
.nav a { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; color: var(--muted); text-decoration: none; font-weight: 500; }
.nav a:hover { background: var(--surface-2); color: var(--fg); }
.nav a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
.nav .count { margin-left: auto; font-size: 11.5px; font-family: var(--f-mono); background: var(--warn-soft); color: var(--warn); border-radius: 999px; padding: 0 7px; }
.side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 8px; }
.demo-note { background: var(--surface-2); border-radius: 12px; padding: 10px 12px; font-size: 12px; color: var(--muted); }
.main { min-width: 0; display: flex; flex-direction: column; gap: 20px; }
.topbar { display: flex; align-items: center; gap: 10px; min-height: 48px; }
.crumb { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; min-width: 0; }
.crumb b { color: var(--fg); font-weight: 600; }
.top-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.me-chip { display: flex; align-items: center; gap: 10px; padding: 4px 6px 4px 4px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; }
.me-chip .who { display: flex; flex-direction: column; line-height: 1.2; text-align: left; }
.me-chip .who small { color: var(--muted); font-size: 11.5px; }
.btn.menu-btn { display: none; }
.page { display: flex; flex-direction: column; gap: 20px; padding-bottom: 40px; }
.page-head { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 16px; }
.page-head > div:first-child { flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.page-head .actions { display: flex; flex-wrap: wrap; gap: 8px; }

/* Controls */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 10px; padding: 8px 14px; font-weight: 500; cursor: pointer; white-space: nowrap; text-decoration: none; }
.btn:hover { border-color: var(--faint); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.07); }
.btn.ok { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.btn.bad { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, var(--line)); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.sm { padding: 5px 10px; font-size: 12.5px; border-radius: 8px; }
.btn.icon { padding: 8px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.input, .select, .textarea { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 12px; min-width: 0; }
.select { padding-right: 28px; }
.textarea { min-height: 110px; resize: vertical; line-height: 1.6; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > label, .field > .lbl { font-size: 12.5px; font-weight: 600; color: var(--muted); }
.field .hint { font-size: 12px; color: var(--faint); }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 14px; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.filters .select, .filters .input { width: auto; }
.filters .input { flex: 1 1 220px; }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 10px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; padding: 5px 12px; border-radius: 8px; cursor: pointer; color: var(--muted); font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: var(--shadow); }
.check { display: inline-flex; gap: 8px; align-items: center; cursor: pointer; user-select: none; }
.check input { accent-color: var(--accent); width: 16px; height: 16px; }

/* Surfaces */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; min-width: 0; }
.card-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
.card-head .sp { margin-left: auto; }
.cols { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 20px; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; text-decoration: none; color: inherit; }
a.tile:hover { border-color: var(--accent); }
.tile .k-val { font-family: var(--f-display); font-size: 30px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
.tile .k-sub { font-size: 12.5px; color: var(--muted); }
.tile.warn .k-val { color: var(--warn); }
.tile.bad .k-val { color: var(--bad); }
.up { color: var(--ok); } .down { color: var(--bad); }

/* Pills & badges */
.pill { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 1px 9px; font-size: 12px; font-weight: 500; white-space: nowrap; background: var(--surface-2); color: var(--muted); }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.plain::before { display: none; }
.t-neutral { background: var(--surface-2); color: var(--muted); }
.t-info { background: var(--info-soft); color: var(--info); }
.t-warn { background: var(--warn-soft); color: var(--warn); }
.t-bad { background: var(--bad-soft); color: var(--bad); }
.t-accent { background: var(--accent-soft); color: var(--accent); }
.t-teal { background: var(--teal-soft); color: var(--teal); }
.t-ok { background: var(--ok-soft); color: var(--ok); }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; display: inline-block; }
.d-neutral { background: var(--faint); } .d-info { background: var(--info); } .d-warn { background: var(--warn); } .d-bad { background: var(--bad); } .d-accent { background: var(--accent); } .d-teal { background: var(--teal); } .d-ok { background: var(--ok); }
.chb { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 6px; font-size: 10px; font-weight: 700; flex: none; letter-spacing: -.02em; box-shadow: inset 0 0 0 1px rgba(255,255,255,.12); }
.chb.lg { width: 40px; height: 40px; border-radius: 11px; font-size: 15px; }
.chs { display: inline-flex; gap: 3px; flex-wrap: wrap; }
.av { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; font-size: 12px; font-weight: 600; flex: none; color: #fff; }
.av.lg { width: 44px; height: 44px; font-size: 16px; }
.star { border: 0; background: transparent; cursor: pointer; color: var(--faint); padding: 4px; border-radius: 6px; display: inline-grid; place-items: center; }
.star:hover { color: var(--fav); background: var(--surface-2); }
.star.on { color: var(--fav); }
.cap { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; border-radius: 6px; padding: 1px 7px; white-space: nowrap; }
.cap.yes { background: var(--ok-soft); color: var(--ok); }
.cap.partial { background: var(--warn-soft); color: var(--warn); }
.cap.no { background: var(--bad-soft); color: var(--bad); }

/* Lists & tables */
.list { display: flex; flex-direction: column; }
.li { display: flex; gap: 12px; align-items: center; padding: 10px 6px; border-top: 1px solid var(--line); cursor: pointer; border-radius: 8px; min-width: 0; }
.li:first-child { border-top: 0; }
.li:hover { background: var(--surface-2); }
.li .grow { flex: 1; min-width: 0; }
.li .title { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.li .sub { font-size: 12.5px; color: var(--muted); }
.task-ico { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; flex: none; }
.scroll-x { overflow-x: auto; }
.tbl { width: 100%; border-collapse: collapse; min-width: 720px; }
.tbl th { text-align: left; font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tbl tbody tr { cursor: pointer; }
.tbl tbody tr:hover td { background: var(--surface-2); }
.tbl td.r, .tbl th.r { text-align: right; }
.tbl .t-title { font-weight: 500; }
.empty { padding: 28px 12px; text-align: center; color: var(--muted); }

/* Calendar */
.cal-bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.cal-title { font-family: var(--f-display); font-size: 20px; font-weight: 600; min-width: 170px; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: var(--line); gap: 1px; }
.cal .dow { background: var(--surface-2); padding: 6px 8px; font-size: 12px; color: var(--muted); font-weight: 600; }
.cal .cell { background: var(--surface); min-height: 118px; padding: 6px; display: flex; flex-direction: column; gap: 4px; cursor: pointer; min-width: 0; position: relative; }
.cal .cell.out { background: var(--bg); }
.cal .cell.out .dn { color: var(--faint); }
.cal .cell.sel { box-shadow: inset 0 0 0 2px var(--accent); }
.cal .dn { font-size: 12.5px; font-weight: 600; font-family: var(--f-mono); display: flex; align-items: center; justify-content: space-between; }
.cal .today .dn span { background: var(--accent); color: var(--accent-ink); border-radius: 999px; padding: 0 7px; }
.cal .add { opacity: 0; border: 0; background: var(--surface-2); color: var(--muted); border-radius: 6px; width: 22px; height: 22px; display: grid; place-items: center; cursor: pointer; }
.cal .cell:hover .add { opacity: 1; }
.chip { display: flex; align-items: center; gap: 5px; font-size: 12px; padding: 2px 6px; border-radius: 6px; background: var(--surface-2); border-left: 3px solid var(--faint); cursor: pointer; min-width: 0; }
.chip .tt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
.chip .tm { font-family: var(--f-mono); color: var(--muted); font-size: 11px; }
.chip.s-neutral { border-left-color: var(--faint); } .chip.s-info { border-left-color: var(--info); } .chip.s-warn { border-left-color: var(--warn); } .chip.s-bad { border-left-color: var(--bad); } .chip.s-accent { border-left-color: var(--accent); } .chip.s-teal { border-left-color: var(--teal); } .chip.s-ok { border-left-color: var(--ok); }
.chip:hover { background: var(--accent-soft); }
.more { font-size: 11.5px; color: var(--muted); padding-left: 4px; }
.dots { display: none; gap: 3px; flex-wrap: wrap; }
.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }

/* Week strip */
.week { display: grid; grid-template-columns: repeat(7, minmax(130px, 1fr)); gap: 8px; }
.wday { background: var(--surface-2); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 6px; min-height: 120px; }
.wday.today { background: var(--accent-soft); }
.wday .wd { font-size: 12px; color: var(--muted); font-weight: 600; }
.wday .chip { background: var(--surface); }

/* Approvals */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs button { border: 0; background: transparent; padding: 10px 14px; cursor: pointer; color: var(--muted); font-weight: 600; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; display: inline-flex; gap: 8px; align-items: center; }
.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
.tabs .n { font-family: var(--f-mono); font-size: 11.5px; background: var(--surface-2); border-radius: 999px; padding: 0 7px; }
.qcard { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px; align-items: start; }
.qcard .cap-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.mode { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 8px; padding: 3px 8px 3px 4px; font-size: 12px; }
.caption-box { background: var(--surface-2); border-radius: 10px; padding: 10px 12px; white-space: pre-wrap; font-size: 13.5px; max-height: 190px; overflow: auto; }
.q-actions { display: flex; flex-direction: column; gap: 8px; min-width: 170px; }
.banner { display: flex; gap: 10px; align-items: flex-start; border-radius: 12px; padding: 12px 14px; background: var(--info-soft); color: var(--fg); }
.banner .ico { color: var(--info); margin-top: 2px; }
.banner.warn { background: var(--warn-soft); } .banner.warn .ico { color: var(--warn); }

/* Channels */
.ch-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 380px), 1fr)); gap: 16px; }
.ch-card { display: flex; flex-direction: column; gap: 14px; }
.ch-top { display: flex; gap: 12px; align-items: flex-start; }
.ch-top .grow { flex: 1; min-width: 0; }
.capline { display: grid; grid-template-columns: 112px minmax(0,1fr); gap: 4px 12px; align-items: start; padding: 10px 0; border-top: 1px solid var(--line); }
.capline .k { font-size: 12.5px; color: var(--muted); font-weight: 600; padding-top: 1px; }
.capline .v { display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
.req { font-size: 12.5px; color: var(--muted); background: var(--surface-2); border-radius: 10px; padding: 8px 10px; }
.ch-foot { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: auto; }
.switch { position: relative; width: 36px; height: 20px; flex: none; }
.switch input { opacity: 0; width: 100%; height: 100%; margin: 0; position: absolute; cursor: pointer; }
.switch span { position: absolute; inset: 0; background: var(--line); border-radius: 999px; pointer-events: none; transition: background .15s; }
.switch span::after { content: ""; position: absolute; width: 16px; height: 16px; left: 2px; top: 2px; border-radius: 50%; background: var(--surface); transition: transform .15s; }
.switch input:checked + span { background: var(--accent); }
.switch input:checked + span::after { transform: translateX(16px); }

/* Reports */
.chart-wrap { position: relative; }
.chart { width: 100%; height: auto; display: block; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .lbl { fill: var(--faint); font-size: 11px; font-family: var(--f-mono); }
.chart .line { fill: none; stroke: var(--accent); stroke-width: 2.25; }
.chart .area { fill: var(--accent); fill-opacity: .12; }
.chart .end { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }
.chart .guide { stroke: var(--muted); stroke-dasharray: 3 3; }
.tip { position: absolute; pointer-events: none; background: var(--fg); color: var(--bg); border-radius: 8px; padding: 6px 9px; font-size: 12px; white-space: nowrap; transform: translate(-50%, -110%); }
.bars { display: flex; flex-direction: column; gap: 10px; }
.bar-row { display: grid; grid-template-columns: 120px minmax(0, 1fr) 64px; gap: 10px; align-items: center; font-size: 13px; }
.bar-row .nm { display: flex; gap: 8px; align-items: center; min-width: 0; }
.bar-row .nm span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar-track { height: 10px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
.bar-fill { height: 100%; background: var(--accent); border-radius: 999px; }
.bar-fill.manual { background: repeating-linear-gradient(135deg, var(--warn) 0 6px, color-mix(in srgb, var(--warn) 60%, transparent) 6px 10px); }
.src { font-size: 11px; font-weight: 600; border-radius: 5px; padding: 0 6px; }
.src.api { background: var(--ok-soft); color: var(--ok); }
.src.manual { background: var(--warn-soft); color: var(--warn); }
.src.miss { background: var(--bad-soft); color: var(--bad); }

/* Drawer & modal */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 40; }

const chb = (id, lg = false) => { const c = CH[id]; return `<span class="chb${lg ? ' lg' : ''}" style="background:${c.bg};color:${c.fg}" title="${esc(c.name)}">${c.s}</span>`; };
const chbs = ids => `<span class="chs">${ids.map(id => chb(id)).join('')}</span>`;
const capLabel = v => v === 'yes' ? 'ได้' : v === 'partial' ? 'บางส่วน' : 'ไม่ได้';

/* how a post to channel ch goes out for content c */
function publishMode(ch, c) {
  const k = CH[ch], st = CHS()[ch];
  if (workOf(c.work).manual) return { mode: 'manual', reason: 'งานประเภทนี้ต้องทำในระบบของแพลตฟอร์มเอง' };
  if (k.post === 'no') return { mode: 'manual', reason: 'แพลตฟอร์มไม่มี API สำหรับโพสต์' };
  if (!st.connected) return { mode: 'manual', reason: 'ยังไม่ได้เชื่อมต่อบัญชี' };
  if (!k.types.includes(c.type)) return { mode: 'manual', reason: `API ไม่รองรับ${TYPES[c.type]}` };
  if (ch === 'tiktok' && !st.audited) return { mode: 'draft', reason: 'ส่งเข้า Inbox ในแอป TikTok ต้องกดโพสต์เอง' };
  return { mode: 'auto', reason: 'โพสต์อัตโนมัติผ่าน API' };
}
const MODE_UI = { auto: { label: 'โพสต์อัตโนมัติ', icon: 'bolt', tone: 'ok' }, draft: { label: 'ส่งเป็นแบบร่าง', icon: 'inbox', tone: 'warn' }, manual: { label: 'ต้องโพสต์เอง', icon: 'hand', tone: 'bad' } };
const modeChip = (ch, c) => { const m = publishMode(ch, c), u = MODE_UI[m.mode]; return `<span class="mode" title="${esc(m.reason)}">${chb(ch)}<span style="color:var(--${u.tone})">${ic(u.icon, 'sm')}</span>${u.label}</span>`; };
const statsOk = ch => CH[ch].stats !== 'no' && CHS()[ch].connected;

/* preview frame per platform/format */
function previewFrame(p, f) {
  if (p === 'line') return { ratio: '1 / 1', layout: 'line', label: 'การ์ด LINE' };
  if (f === 'article') return { ratio: '16 / 9', layout: 'article', label: 'บทความ' };
  if (f === 'reel' || p === 'tiktok') return { ratio: '9 / 16', layout: 'vertical', label: 'แนวตั้ง 9:16' };
  if (p === 'youtube') return { ratio: '16 / 9', layout: 'youtube', label: 'แนวนอน 16:9' };
  if (p === 'instagram' || p === 'lemon8') return { ratio: '4 / 5', layout: 'feed', label: '4:5' };
  if (f === 'video') return { ratio: '16 / 9', layout: 'feed', label: 'แนวนอน 16:9' };
  return { ratio: '1 / 1', layout: 'feed', label: 'สี่เหลี่ยมจัตุรัส 1:1' };
}

const NOW = () => new Date();
function genMetrics(c, ch, rnd, age) {
  const base = { tiktok: 21000, instagram: 9200, facebook: 7400, youtube: 6100, web: 2300, x: 1900, line: 5200, lemon8: 2700 }[ch];
  const tf = { reel: 1.3, video: 1, image: .7, carousel: .9, article: .6 }[c.type];
  const views = Math.round(base * tf * (.45 + rnd() * 1.3) * Math.min(1, .35 + age / 10));
  const likes = Math.round(views * (.025 + rnd() * .06));
  const m = { views, likes, comments: Math.round(likes * (.05 + rnd() * .09)), shares: Math.round(likes * (.06 + rnd() * .16)), clicks: Math.round(views * (.008 + rnd() * .025)) };
  for (const k of Object.keys(FIELDS)) if (!CH[ch].fields.includes(k)) m[k] = null;
  return m;
}

/* ---------- overview ---------- */
function myTasks() {
  const u = me(), t = [];
  const push = (tone, icon, text, c, sub) => t.push({ tone, icon, text, c, sub });
  if (can('approve')) PC().filter(c => c.status === 'review').forEach(c => push('warn', 'approve', `อนุมัติ: ${c.title}`, c, `ส่งโดย ${user(c.owner).nick} · ลงวันที่ ${fmtD(c.date)}`));
  if (can('publish')) PC().filter(c => c.status === 'approved').forEach(c => push('accent', 'send', `ตั้งเวลา/เผยแพร่: ${c.title}`, c, `กำหนดลง ${fmtDT(c.date)}`));
  PC().filter(c => c.status === 'changes' && (c.owner === u.id || can('editAny'))).forEach(c => push('bad', 'pen', `แก้ตามคอมเมนต์: ${c.title}`, c, c.comments.length ? `“${c.comments[c.comments.length - 1].text.slice(0, 60)}…”` : ''));
  if (can('manual')) manualQueue().filter(q => q.c.owner === u.id || can('editAny')).forEach(q => push('bad', 'hand', `โพสต์เองที่ ${CH[q.ch].name}: ${q.c.title}`, q.c, q.r.reason || ''));
  if (roleOf() === 'creator') PC().filter(c => c.owner === u.id && ['idea', 'draft'].includes(c.status) && daysBetween(NOW(), parse(c.date)) <= 7).forEach(c => push('info', 'clock', `ทำให้เสร็จก่อน ${fmtD(c.date)}: ${c.title}`, c, ST[c.status].label));
  if (can('metrics')) missingMetrics().forEach(q => push('warn', 'chart', `กรอกผลลัพธ์ ${CH[q.ch].name}: ${q.c.title}`, q.c, 'ช่องทางนี้ดึงสถิติผ่าน API ไม่ได้'));
  return t;
}
function viewsInWindow(fromDaysAgo, toDaysAgo) {
  const now = NOW(); let v = 0, e = 0, n = 0;
  for (const c of PC()) { if (c.status !== 'published') continue; const d = daysBetween(parse(c.date), now); if (d >= toDaysAgo && d < fromDaysAgo) { const t = totals(c); v += t.views; e += t.eng; n++; } }
  return { v, e, n };
}
function delta(cur, prev) { if (!prev) return '<span class="faint">ไม่มีข้อมูลช่วงก่อน</span>'; const d = (cur - prev) / prev; return `<span class="${d >= 0 ? 'up' : 'down'}">${d >= 0 ? '▲' : '▼'} ${Math.abs(d * 100).toFixed(0)}%</span> เทียบช่วงก่อน`; }
function chipHTML(c, drag) {

}

function calFilter(c) {

  if (UI.calWork !== 'all' && c.work !== UI.calWork) return false;
  if (UI.calMine && c.owner !== S.uid) return false;
  return true;
}

      <div class="dn"><span>${d.getDate()}</span>${can('create') ? `<button class="add" data-act="new:${k}" aria-label="เพิ่มคอนเทนต์วันที่ ${d.getDate()}">${ic('plus', 'sm')}</button>` : ''}</div>

const DECAY = [.30, .18, .12, .09, .07, .06, .05, .04, .03, .02, .015, .01, .008, .007];
function dailySeries(days) {
  const now = startOfDay(NOW()); const start = addDays(now, -(days - 1));
  const arr = [...Array(days)].map((_, i) => ({ d: addDays(start, i), v: 0 }));
  for (const c of PC()) { if (c.status !== 'published') continue; const v = totals(c).views; const p = daysBetween(start, parse(c.date));
    DECAY.forEach((w, i) => { const idx = p + i; if (idx >= 0 && idx < days) arr[idx].v += v * w; }); }
  return arr;
}
function niceMax(m) { if (m <= 0) return 10; const p = Math.pow(10, Math.floor(Math.log10(m))); const f = m / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p; }
function areaChart(series) {
  const W = 760, H = 240, L = 48, R = 14, T = 14, B = 28, n = series.length;
  const max = niceMax(Math.max(...series.map(s => s.v)) * 1.05);
  const x = i => L + (W - L - R) * (n === 1 ? .5 : i / (n - 1)), y = v => T + (H - T - B) * (1 - v / max);
  let grid = '';
  for (let k = 0; k <= 4; k++) { const v = max * k / 4, yy = y(v); grid += `<line class="grid" x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}"/><text class="lbl" x="${L - 8}" y="${yy + 4}" text-anchor="end">${fmtN(v)}</text>`; }
  const step = Math.ceil(n / 6);
  let xl = ''; series.forEach((s, i) => { if ((n - 1 - i) % step === 0) xl += `<text class="lbl" x="${x(i)}" y="${H - 8}" text-anchor="${i === n - 1 ? 'end' : 'middle'}">${fmtD(s.d)}</text>`; });
  const line = 'M' + series.map((s, i) => `${x(i).toFixed(1)},${y(s.v).toFixed(1)}`).join('L'), area = `${line}L${x(n - 1)},${y(0)}L${x(0)},${y(0)}Z`;
  return `<div class="chart-wrap" id="trend" data-series='${JSON.stringify(series.map(s => [fmtD(s.d), Math.round(s.v)]))}' data-geo="${[W, H, L, R, T, B, max].join(',')}">
    <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="ยอดวิวรายวัน">${grid}${xl}<path class="area" d="${area}"/><path class="line" d="${line}"/>
    <circle class="end" cx="${x(n - 1)}" cy="${y(series[n - 1].v)}" r="4.5"/><line class="guide" id="g-line" x1="0" x2="0" y1="${T}" y2="${H - B}" visibility="hidden"/><circle class="end" id="g-dot" r="4" visibility="hidden"/>
    <rect id="g-hit" x="${L}" y="${T}" width="${W - L - R}" height="${H - T - B}" fill="transparent"/></svg><div class="tip" id="g-tip" hidden></div></div>`;
}
function bindChart() {
  const w = $('#trend'); if (!w) return;
  const data = JSON.parse(w.dataset.series); const [W, H, L, R, T, B, max] = w.dataset.geo.split(',').map(Number);
  const svg = $('svg', w), hit = $('#g-hit'), gl = $('#g-line'), gd = $('#g-dot'), tip = $('#g-tip'); const n = data.length;
  hit.addEventListener('pointermove', ev => { const r = svg.getBoundingClientRect(); const sx = (ev.clientX - r.left) / r.width * W; const i = Math.max(0, Math.min(n - 1, Math.round((sx - L) / (W - L - R) * (n - 1))));
    const xx = L + (W - L - R) * (n === 1 ? .5 : i / (n - 1)), yy = T + (H - T - B) * (1 - data[i][1] / max);
    gl.setAttribute('x1', xx); gl.setAttribute('x2', xx); gl.setAttribute('visibility', 'visible'); gd.setAttribute('cx', xx); gd.setAttribute('cy', yy); gd.setAttribute('visibility', 'visible');
    tip.hidden = false; tip.style.left = (xx / W * r.width) + 'px'; tip.style.top = (yy / H * r.height) + 'px'; tip.textContent = `${data[i][0]} · ${data[i][1].toLocaleString('en-US')} วิว`; });
  hit.addEventListener('pointerleave', () => { gl.setAttribute('visibility', 'hidden'); gd.setAttribute('visibility', 'hidden'); tip.hidden = true; });
}

/* ---------- mutations ---------- */
function doPublish(c, silent) {
  c.status = 'published';
  if (parse(c.date) > NOW()) c.date = toLocal(NOW());
  c.results = {}; c.metrics = {};
  for (const ch of c.channels) { const m = publishMode(ch, c);
    c.results[ch] = m.mode === 'auto' ? { state: 'posted', url: CH[ch].url, at: toLocal(NOW()) } : { state: m.mode === 'draft' ? 'draft-sent' : 'manual-todo', reason: m.reason }; }
  if (!silent) log('เผยแพร่', c.id);
}
function syncMetrics(only) {
  let n = 0;
  for (const c of PC()) { if (c.status !== 'published' || (only && c.id !== only)) continue;
    const rnd = rngOf(c.id + Date.now()); const age = Math.max(1, daysBetween(parse(c.date), NOW()));
    for (const ch of c.channels) { const r = c.results[ch]; if (!r || !['posted', 'manual-done'].includes(r.state) || !statsOk(ch)) continue;
      const m = c.metrics[ch];
      if (m && m.src === 'api') { for (const k of Object.keys(FIELDS)) if (m[k] != null) m[k] = Math.round(m[k] * (1 + rnd() * .05)); }
      else c.metrics[ch] = { ...genMetrics(c, ch, rnd, age), src: 'api', at: toLocal(NOW()) };
      n++; } }
  return n;
}
function runScheduled() {
  let n = 0; const keep = S.pid;
  for (const c of S.content) if (c.status === 'scheduled' && parse(c.date) <= NOW()) { S.pid = c.project; doPublish(c, true); n++; }
  S.pid = keep;
  if (n) { save(); toast(`โพสต์ตามเวลาที่ตั้งไว้ ${n} ชิ้น`); render(); }
}
function moveTo(id, day) {
  const c = getC(id); if (!c || !canEdit(c)) return;
  const t = c.date.split('T')[1]; if (c.date.slice(0, 10) === day) return;
  c.date = `${day}T${t}`;
  const back = ['approved', 'scheduled'].includes(c.status);
  if (back) c.status = 'review';
  log('ย้ายวันลงงาน', c.id); save(); toast(back ? 'ย้ายวันแล้ว งานกลับไปรออนุมัติใหม่' : 'ย้ายวันแล้ว'); render();
}
function readImages(files) {
  return Promise.all([...files].filter(f => f.type.startsWith('image/')).slice(0, 6).map(f => new Promise(res => {
    const img = new Image(); const url = URL.createObjectURL(f);
    img.onload = () => { const scale = Math.min(1, 900 / Math.max(img.width, img.height)); const cv = document.createElement('canvas');
      cv.width = Math.round(img.width * scale); cv.height = Math.round(img.height * scale); cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(url); res(cv.toDataURL('image/jpeg', .82)); };
    img.onerror = () => { URL.revokeObjectURL(url); res(null); };
    img.src = url;
  }))).then(a => a.filter(Boolean));
}

    readImages(el.files).then(list => {
      if (!list.length) { toast('เลือกได้เฉพาะไฟล์รูป'); return; }
      if (el.dataset.upload === 'editor') { UI.modal.pending = [...(UI.modal.pending || []), ...list]; snapshotEditor(); render(); }
      else { const c = getC(el.dataset.upload); c.media.push(...list.map(src => ({ src }))); save(); toast(`เพิ่มรูปแล้ว ${list.length} รูป`); render(); }
    });
    return;
  }
  if (el.closest('#f-chs') || el.id === 'f-type' || el.id === 'f-work') {
    if (el.id === 'f-type' || el.id === 'f-work') { const sel = $$('#f-chs input:checked').map(i => i.value); $('#f-chs').innerHTML = chOptions({ type: $('#f-type').value, work: $('#f-work').value }, sel); }
    updateCapHint(); return;
  }
  const key = el.dataset.change; if (!key) return;
  const [k, arg] = key.split(':');
  const res = CHANGE[k]?.(el.value, el, arg);
  if (res === 'lib') { $('#lib-list').innerHTML = libRows(libList(), 'ไม่พบคอนเทนต์ที่ตรงกับตัวกรอง'); return; }
  render();
});
/* เก็บค่าที่พิมพ์ในฟอร์มไว้ก่อน render ใหม่ (ตอนเพิ่มรูป) */
function snapshotEditor() {
  const f = $('form[data-form="editor"]'); if (!f) return;
  const M = UI.modal; const fd = new FormData(f);
  const tmp = M.id ? getC(M.id) : null;
  M.type = fd.get('type'); M.work = fd.get('work'); M.channels = fd.getAll('ch');
  M.draftVals = { title: fd.get('title'), caption: fd.get('caption'), date: fd.get('date'), time: fd.get('time'), capx: fd.get('capx') };
  void tmp;
}
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.input === 'libQ') { UI.libQ = el.value; $('#lib-list').innerHTML = libRows(libList(), 'ไม่พบคอนเทนต์ที่ตรงกับตัวกรอง'); }
  if (el.dataset.input === 'wizacc') UI.modal.account = el.value;
  if (el.id === 'f-cap' || el.id === 'f-capx') updateCapHint();
});
document.addEventListener('dragstart', e => { const id = e.target.closest?.('[data-drag]')?.dataset.drag; if (id) { e.dataTransfer.setData('text/plain', id); e.dataTransfer.effectAllowed = 'move'; } });
document.addEventListener('dragover', e => { const cell = e.target.closest?.('.cal .cell'); if (cell) { e.preventDefault(); $$('.cal .cell.over').forEach(x => x !== cell && x.classList.remove('over')); cell.classList.add('over'); } });
document.addEventListener('dragleave', e => { const cell = e.target.closest?.('.cal .cell'); if (cell && !cell.contains(e.relatedTarget)) cell.classList.remove('over'); });
document.addEventListener('drop', e => { const cell = e.target.closest?.('.cal .cell'); if (!cell) return; e.preventDefault(); cell.classList.remove('over'); const id = e.dataTransfer.getData('text/plain'); if (id) moveTo(id, cell.dataset.day); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if (UI.modal && !(UI.modal.kind === 'publishing' && !UI.modal.done)) { UI.modal = null; render(); } else if (UI.drawer) { UI.drawer = null; render(); } else if (UI.menu || UI.switcher) { UI.menu = false; UI.switcher = false; render(); } } });
window.addEventListener('hashchange', () => { UI.menu = false; UI.switcher = false; UI.drawer = null; render(); window.scrollTo(0, 0); });
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => render());

/* restore typed editor values after a re-render triggered by adding photos */
const _editorHTML = editorHTML;
editorHTML = M => {
  let html = _editorHTML(M);
  if (M.draftVals) setTimeout(() => { const f = $('form[data-form="editor"]'); if (!f) return; for (const [k, v] of Object.entries(M.draftVals)) if (f.elements[k] && v != null) f.elements[k].value = v; updateCapHint(); }, 0);
  return html;
};

runScheduled();
setInterval(runScheduled, 30000);
render();
})();
</script>
